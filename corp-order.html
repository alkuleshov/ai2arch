<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap');
:root{--navy:#0A0F1A;--navy2:#13234B;--ink:#0A0F1A;--muted:#5A6070;--faint:#6B7180;--bg:#F6F4F0;--line:#E1DDD5;--accent:#2B4FD8;--accent-l:#E4EBFB;--accent-b:#BED0EE;--orange:#8A2D57;--orange-l:#F7E9EF;--orange-b:#EDC3D2;--sans:'Inter Tight','Helvetica Neue',Arial,system-ui,sans-serif;--head:60px}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip;letter-spacing:-.005em}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea{font-family:var(--sans);color:inherit}
button{cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.hd{position:fixed;top:0;left:0;right:0;z-index:60;height:var(--head);background:var(--bg);border-bottom:1px solid var(--line)}
.hd .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hd a{font-size:13px;font-weight:800;color:var(--navy)}
.hd .brand{display:flex;align-items:center;gap:10px;text-decoration:none!important}.hd .brand b{display:block;font-size:17px;line-height:1.1;font-weight:900;letter-spacing:-.01em}.hd .brand small{display:block;font-size:11px;font-weight:600;color:var(--faint)}
.top{padding:calc(var(--head) + 36px) 0 22px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h1{font-size:clamp(30px,4.6vw,52px);font-weight:900;line-height:.98;letter-spacing:-.04em;color:var(--navy)}
h1 span{color:var(--faint);white-space:nowrap}
.meta{margin-top:12px;color:var(--muted);font-size:14.5px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start;padding-bottom:60px}
.paper{background:#fff;border:1px solid var(--line);border-radius:0;padding:26px;box-shadow:none}
.paper h2{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 8px 10px 0;border-bottom:1px solid var(--navy)}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
td.r,th.r{text-align:right;padding-right:0;white-space:nowrap}
td.n{color:var(--faint);width:26px}
tr.tot td{border-bottom:0;padding-top:14px;font-weight:800;color:var(--navy);font-size:16px}
.tot .big{font-size:24px;font-weight:900;letter-spacing:-.03em}
.small{font-size:12.5px;color:var(--muted);margin-top:12px}
.res{margin-top:22px;padding-top:18px;border-top:1px solid var(--navy)}
.res ul{list-style:none;display:grid;gap:8px}
.res li{font-size:13.5px;color:var(--muted);padding-left:18px;position:relative}
.res li::before{content:'';position:absolute;left:2px;top:8px;width:7px;height:7px;background:var(--accent)}
.res li b{color:var(--navy)}
.side{display:grid;gap:12px;position:sticky;top:calc(var(--head) + 14px)}
.card{background:#fff;border:1px solid var(--line);border-radius:0;padding:18px}
.card.dark{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card.dark h3{color:#fff}
.card p{font-size:13.5px;color:var(--muted)}
.card.dark p{color:#C9D1E6}
.num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:0;background:var(--navy);color:#fff;font-size:12px;font-weight:800;flex:none}
.card.dark .num{background:var(--orange-b);color:var(--navy)}
.sum{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:0;padding:13px 16px;font-size:14px;font-weight:800;border:0;text-decoration:none!important;margin-top:12px;transition:background .15s}
.btn.pri{background:var(--accent);color:#fff}.btn.pri:hover{background:#2140B5}
.btn.ghost{background:var(--bg);color:var(--navy);border:1px solid var(--navy)}.btn.ghost:hover{background:var(--navy);color:#fff}
.btn.wl{background:rgba(255,255,255,.14);color:#fff}.btn.wl:hover{background:rgba(255,255,255,.24)}
.btn:disabled{opacity:.5;cursor:wait}
form{display:grid;gap:10px;margin-top:12px}
label{display:grid;gap:4px;font-size:12px;font-weight:800;color:var(--faint);letter-spacing:.04em}
input,textarea{width:100%;border:1px solid var(--line);border-radius:0;padding:10px 12px;font-size:14px;font-weight:500;background:var(--bg);color:var(--navy);resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent-b);border-color:var(--accent)}
.card.dark label{color:#B8C2DE}
.card.dark .hint{color:#9AA6C4}
.qr{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--navy);text-align:center}
.qr.show{display:block}
.qr svg{width:200px;height:200px}
.qr p{font-size:12.5px}
.hint{font-size:12px;color:var(--faint);margin-top:8px}
.steps{list-style:none;display:grid;gap:10px;margin-top:8px}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:13px;color:var(--muted)}
.steps b{color:var(--navy)}
.empty{text-align:center;padding:80px 0}
.empty p{color:var(--muted);margin:10px 0 18px}
.empty .btn{display:inline-flex;width:auto}
.ft{border-top:1px solid var(--navy);padding:26px 0 44px;font-size:12px;color:var(--faint)}
.ft-row{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;flex-wrap:wrap}
.ft-brand{display:flex;align-items:center;gap:12px;color:var(--navy);text-decoration:none!important}.ft-brand b{display:block;font-size:19px;line-height:1.1;font-weight:900;letter-spacing:-.01em}.ft-brand small{display:block;font-size:11.5px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;font-size:13px;font-weight:700;padding:10px 16px;border-radius:0;opacity:0;pointer-events:none;transition:all .2s;z-index:120;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}}
@media(max-width:640px){
 .wrap{padding:0 16px}
 .top{padding:calc(var(--head) + 22px) 0 16px}
 .paper{padding:18px 16px}
 table{font-size:13px}
 th.hide,td.hide{display:none}
}

/* видимая сетка: линии колонок 1200px-контейнера (4 колонки; с 900px — 8) */
section{background-image:linear-gradient(to right, rgba(10,15,26,.07) 0 1px, transparent 1px);background-size:calc(min(100%, 1200px) / 4) 100%;background-position:center top;background-repeat:repeat-x}
@media (min-width:900px){section{background-size:calc(min(100%, 1200px) / 8) 100%}}
  /* верхняя панель в формате пособий: бумага, ink-линия, без тени */
  header.hd, header.head { background:#F6F4F0 !important; border-bottom:1.5px solid #0A0F1A !important; box-shadow:none !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; min-height:54px; }
  /* шапка лендинга в формате пособий: высота 54 px, квадратные кнопки-контуры */
  header.hd, header.head { height:54px !important; min-height:54px !important; }
  header.hd > .wrap, header.head > .wrap, header.hd .wrap, header.head .wrap { height:54px; display:flex; align-items:center; }
  header.hd .btn, header.hd .hd-btn, header.hd .btn-primary, header.head .btn, header.head .btn-primary, header.head .btn-sm { border-radius:0 !important; border:1.5px solid #0A0F1A !important; background:transparent !important; color:#0A0F1A !important; font-size:14px !important; font-weight:800 !important; padding:14px 20px !important; line-height:normal !important; box-shadow:none !important; }
  header.hd .btn:hover, header.hd .hd-btn:hover, header.head .btn:hover { background:transparent !important; color:#0A0F1A !important; }
  header.hd nav a, header.head nav a, header.hd .nav a, header.head .nav a { font-size:14px !important; font-weight:800 !important; color:#0A0F1A !important; }
  /* единая шапка-логотип: один отступ от края, один знак 38 px, одна подпись на всех страницах */
  header :is(.wrap,.head-in) { max-width:none !important; width:100% !important; margin:0 !important; padding:0 24px !important; box-sizing:border-box !important; }
  @media (max-width:760px) { header :is(.wrap,.head-in) { padding:0 16px !important; } }
  header :is(.wrap,.head-in) > a:first-child { display:flex !important; align-items:center !important; gap:12px !important; padding:0 !important; margin:0 !important; height:auto !important; min-height:0 !important; border:0 !important; background:none !important; color:#0A0F1A !important; text-decoration:none !important; flex-shrink:0 !important; line-height:1.15 !important; }
  header :is(.wrap,.head-in) > a:first-child img { width:38px !important; height:38px !important; min-width:38px !important; flex:0 0 38px !important; display:block !important; }
  header :is(.wrap,.head-in) > a:first-child > span { display:flex !important; flex-direction:column !important; align-items:flex-start !important; line-height:1.15 !important; }
  header :is(.wrap,.head-in) > a:first-child b { display:block !important; font-size:16px !important; font-weight:800 !important; letter-spacing:-0.02em !important; color:#0A0F1A !important; white-space:nowrap !important; }
  header :is(.wrap,.head-in) > a:first-child small { display:block !important; font-size:11px !important; font-weight:600 !important; letter-spacing:0 !important; color:#5A6070 !important; white-space:nowrap !important; margin:2px 0 0 !important; }
  /* телефон: подпись бренда переносится на две строки, кнопка справа не выходит за экран */
  @media (max-width:760px) { header :is(.wrap,.head-in) > a:first-child small { white-space:normal !important; max-width:138px !important; line-height:1.2 !important; } header.hd .hd-btn { font-size:12px !important; padding:9px 12px !important; white-space:nowrap !important; } }
  @media (max-width:380px) { header.hd .hd-btn { padding:9px 10px !important; } }
/* AFFORDANCE-V1: кликабельные элементы видны в покое и подсвечиваются при наведении */
:root{--aff-accent:var(--accent,#2B4FD8);--aff-ink:var(--ink,#0A0F1A)}
a,button,label,summary{cursor:pointer}
a:focus-visible,button:focus-visible,summary:focus-visible,label:focus-within>input:focus-visible{outline:2px solid var(--aff-accent);outline-offset:3px}
/* текстовые ссылки в содержании: подчёркнуты в покое */
main a:not([class*="btn"]):not([class*="ix"]):not([class*="tile"]):not([class*="goto"]):not([class*="mock"]):not([class*="bullet"]),
.wrap > p a,.wrap li a,.wrap > div a:not([class*="btn"]),.faq a,.pay-note a,.agree a,footer a{
  color:var(--aff-accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;transition:background-color .15s,text-decoration-thickness .15s}
main a:not([class*="btn"]):not([class*="ix"]):not([class*="tile"]):not([class*="goto"]):not([class*="mock"]):not([class*="bullet"]):hover,
.wrap > p a:hover,.wrap li a:hover,.faq a:hover,.pay-note a:hover,.agree a:hover,footer a:hover{
  text-decoration-thickness:2px;background-color:rgba(43,79,216,.10)}
/* кнопки: подъём и тень при наведении */
a[class*="btn"],button[class*="btn"],.submit,.hd-btn,.talk-btn,.linkbtn,.btn{transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease,color .15s ease,border-color .15s ease}
a[class*="btn"]:hover,button[class*="btn"]:hover,.submit:hover,.hd-btn:hover,.talk-btn:hover,.linkbtn:hover,.btn:hover{
  opacity:1 !important;transform:translate(-2px,-2px) !important;box-shadow:4px 4px 0 var(--aff-ink) !important}
/* контурные и призрачные кнопки: заливка при наведении (работает и на плоских страницах) */
a[class*="btn"]:is(.btn-ghost,.btn-line,.btn-light,.btn--line,.ghost,.line):hover,.btn-ghost:hover,.btn-line:hover,.hero .btn-ghost:hover,.hero .btn-line:hover{background:rgba(43,79,216,.12) !important;color:var(--aff-ink) !important;border-color:var(--aff-ink) !important}
/* карточки-ссылки: подъём, тень и смена фона */
a.ix,a.tile,a.bullet,a.goto,a.mock,a.cell,a.pb,a.fs,a.alt-r,a[class*="card"],a[class*="step"]{transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease}
a.ix:hover,a.tile:hover,a.bullet:hover,a.goto:hover,a.mock:hover,a.cell:hover,a.pb:hover,a.fs:hover,a[class*="card"]:hover,a[class*="step"]:hover{
  transform:translate(-2px,-2px) !important;box-shadow:5px 5px 0 var(--aff-ink) !important;filter:none}
/* сворачиваемые блоки: заголовок подсвечивается, маркер виден */
summary{transition:background-color .15s,color .15s}
summary:hover{background-color:rgba(43,79,216,.08);color:var(--aff-accent)}
details>summary::after{transition:transform .2s}
/* ссылки и кнопки в шапке: подчёркивание при наведении */
header a:not([class*="btn"]):not(.hd-back):hover,.hd nav a:hover,header nav a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
@media (hover:none){a[class*="btn"]:hover,.btn:hover,a.ix:hover,a.tile:hover,a.mock:hover,a.cell:hover{transform:none;box-shadow:none}}
</style>

<body>
<header class="hd"><div class="wrap"><a class="brand" href="./" aria-label="AI2ARCH — на главную"><img src="images/ai2arch-sign.png" width="40" height="40" alt=""><span><b>AI2ARCH</b><small>Лаборатория проектного интеллекта</small></span></a><a id="back" href="corp.html">← Изменить программу</a></div></header>
<main class="wrap" id="app"></main>
<footer class="ft"><div class="wrap ft-row"><a class="ft-brand" href="./"><img src="images/ai2arch-tile.png" width="48" height="48" alt=""><span><b>AI2ARCH · 2026</b><small>Лаборатория проектного интеллекта</small></span></a><div id="reqLine"></div></div></footer>
<div class="toast" id="toast"></div>
<script src="assets/corp-data.js"></script>
<script src="assets/corp-req.js"></script>
<script src="assets/vendor/qrcode.js"></script>

<script>
const {D, REQ, rub, num, totals, rows} = Corp;
const $ = s => document.querySelector(s);
const S = Corp.fromHash();
if (REQ) $('#reqLine').textContent = `${REQ.name} · ИНН ${REQ.inn} · ОГРНИП ${REQ.ogrnip} · р/с ${REQ.account} в ${REQ.bank}, БИК ${REQ.bik}`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2600); }
async function copy(t){ try{ await navigator.clipboard.writeText(t); return true; }catch(e){ return false; } }
function goal(g){ try{ ym(113526373, 'reachGoal', g); }catch(e){} }

if (!S || !totals(S).mods){
  $('#app').innerHTML = `<div class="empty top"><div class="kicker">Корпоративное обучение · Лаборатория проектного интеллекта</div><h1>Программа не найдена</h1><p>Соберите программу в конструкторе и нажмите «Оплатить».</p><a class="btn pri" href="corp.html">Открыть конструктор</a></div>`;
} else {
  const code = Corp.encode(S), id = Corp.programId(code), T = totals(S), R = rows(S);
  const pre = Math.round(T.t * D.prepay), date = new Date().toLocaleDateString('ru-RU');
  $('#back').href = Corp.builderUrl(code);
  document.title = `Программа № ${id} · AI2ARCH`;
  const body = R.map((r, i) => `<tr><td class="n">${i+1}</td><td><b>${esc(r.name)}</b><small>${r.depth} · ${r.fmt.toLowerCase()}${r.n ? ' · ' + r.n + ' чел.' : ''}</small></td><td class="r hide">${r.hours == null ? '—' : num(r.hours) + ' ч'}</td><td class="r">${r.price == null ? 'по запросу' : rub(r.price)}</td></tr>`).join('');
  const invoice = REQ ? `
    <div class="card dark" id="inv"><h3><span class="num">2</span>Счёт-договор и QR-код</h3>
      <p>Заполните после встречи: дни и время занятий войдут в счёт-договор. Оплата счёта — согласие с условиями, отдельный договор не нужен.</p>
      <form id="invForm">
        <label>Заказчик<input name="customer" required placeholder="ООО «Бюро», ИП Иванов И. И."></label>
        <label>ИНН заказчика<input name="inn" inputmode="numeric" pattern="[0-9]{10,12}" placeholder="10 или 12 цифр"></label>
        <label>Дни и время занятий<textarea name="dates" rows="2" required placeholder="например: по вторникам и четвергам, 10:00–13:00"></textarea></label>
        <button class="btn pri" type="submit" id="invBtn">Скачать счёт-договор и показать QR</button>
      </form>
      <div class="qr" id="qr"></div>
    </div>` : `
    <div class="card dark"><h3><span class="num">2</span>Счёт-договор и QR-код</h3>
      <p>Готовим после короткой встречи онлайн, когда согласуем дни и время занятий и состав команды — они войдут в счёт-договор. Оплатить можно по счёту или по QR-коду в банковском приложении.</p>
      <a class="btn pri" href="https://t.me/${D.manager}" target="_blank" rel="noopener" data-tg>Договориться о встрече</a>
    </div>`;
  $('#app').innerHTML = `
  <section class="top"><div class="kicker">Корпоративное обучение · Лаборатория проектного интеллекта</div>
    <h1>Программа <span>№ ${id}</span></h1>
    <div class="meta">${date} · ${T.mods} модулей · ${num(T.off)} ч очно, ${num(T.on)} ч онлайн</div></section>
  <div class="grid">
    <div class="paper">
      <h2>Состав и стоимость</h2>
      <table><thead><tr><th>№</th><th>Услуга</th><th class="r hide">Часы</th><th class="r">Сумма</th></tr></thead>
        <tbody>${body}<tr class="tot"><td></td><td>Итого</td><td class="r hide">${num(T.off + T.on)} ч</td><td class="r big">${rub(T.t)}</td></tr></tbody></table>
      <p class="small">Цены без НДС. ${T.req ? `Модули с ценой по запросу (${T.req}) в итог не входят. ` : ''}Оплата ${Math.round(D.prepay*100)}% — ${rub(pre)} до первого занятия. Акт оказанных услуг — после последнего занятия.</p>
      <div class="res"><h2>Что получит бюро</h2><ul>${R.filter(r => r.result).map(r => `<li><b>${esc(r.name)}</b> — ${esc(r.result)}</li>`).join('')}</ul></div>
    </div>
    <div class="side">
      <div class="card"><div class="kicker" style="margin:0">К оплате</div><div class="sum">${rub(T.t)}</div><p>100% до первого занятия · без НДС</p></div>
      <div class="card"><h3><span class="num">1</span>Программа в PDF</h3><p>Состав, стоимость и порядок работы — чтобы показать руководителю или бухгалтерии.</p>
        <button class="btn ghost" id="pdf" type="button">Скачать PDF</button></div>
      ${invoice}
      <div class="card"><h3><span class="num">3</span>Связаться с менеджером</h3><p>Менеджер увидит вашу программу по номеру <b>${id}</b>: он скопируется вместе со ссылкой, вставьте его в сообщение.</p>
        <a class="btn ghost" href="https://t.me/${D.manager}" target="_blank" rel="noopener" data-tg>Написать в Telegram</a></div>
      <div class="card"><h3>Что дальше</h3><ol class="steps">
        <li><span class="num">1</span><span><b>Встреча онлайн</b> 40–60 минут: программа, смета, документы, дни и время занятий, состав команды.</span></li>
        <li><span class="num">2</span><span><b>Оплата</b> по счёту-договору или QR-коду, 100% до первого занятия.</span></li>
        <li><span class="num">3</span><span><b>Обучение</b> строго в дни и время из счёта-договора. Акт — после последнего занятия.</span></li></ol></div>
    </div>
  </div>`;

  document.addEventListener('click', async e => {
    const tg = e.target.closest('[data-tg]');
    if (tg){ goal('corp_order_telegram'); if (await copy(`Здравствуйте! Программа № ${id}: ${Corp.orderUrl(code)}`)) toast('Номер программы скопирован — вставьте его в сообщение'); return; }
    if (e.target.closest('#pdf')){
      const b = $('#pdf'); b.disabled = true; b.textContent = 'Готовлю PDF…';
      try{ await Corp.downloadPdf(S, 'program'); goal('corp_order_pdf'); toast('PDF скачан'); }catch(err){ toast('Не получилось сформировать PDF, попробуйте ещё раз'); }
      b.disabled = false; b.textContent = 'Скачать PDF';
    }
  });
  const form = $('#invForm');
  if (form) form.addEventListener('submit', async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form)); Object.keys(f).forEach(k => f[k] = f[k].trim());
    const b = $('#invBtn'); b.disabled = true; b.textContent = 'Готовлю счёт…';
    try{
      await Corp.downloadPdf(S, 'invoice', f); goal('corp_invoice');
      const purpose = `Оплата по счёту-договору № ${id} от ${date} за информационно-консультационные услуги. Без НДС`;
      $('#qr').innerHTML = Corp.qrSvg(Corp.payString(pre, purpose)) + `<p>Отсканируйте в банковском приложении организации: получатель, сумма ${rub(pre)} и назначение платежа заполнятся сами.</p>`;
      $('#qr').classList.add('show'); toast('Счёт-договор скачан');
    }catch(err){ toast('Не получилось сформировать счёт, попробуйте ещё раз'); }
    b.disabled = false; b.textContent = 'Скачать счёт-договор и показать QR';
  });
}
</script>
</body>
</html>
